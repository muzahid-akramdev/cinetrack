name: Full TMDb backfill

on:
  workflow_dispatch:
    inputs:
      sources:
        description: 'Comma list: trending,tv,tv_lang,wikidata,ott,movies (or "all")'
        required: false
        default: 'all'
      from_year:
        description: 'First release/air year to include (blank = 1930)'
        required: false
        default: ''
      to_year:
        description: 'Last release/air year to include (blank = next year)'
        required: false
        default: ''

jobs:
  full-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: cinetrack
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run deep backfill
        run: npm run sync:full
        env:
          TMDB_API_ACCESS_TOKEN: ${{ secrets.TMDB_API_ACCESS_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          FULL_SYNC_SOURCES: ${{ github.event.inputs.sources }}
          FULL_SYNC_FROM_YEAR: ${{ github.event.inputs.from_year }}
          FULL_SYNC_TO_YEAR: ${{ github.event.inputs.to_year }}
