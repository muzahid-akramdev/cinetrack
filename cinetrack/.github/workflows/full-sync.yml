name: Full TMDb backfill

# Manual trigger only — this is the deep, one-time (or occasional) catalog
# fill, not the daily incremental update. Run it from the Actions tab:
# Actions -> "Full TMDb backfill" -> Run workflow.
on:
  workflow_dispatch: {}

jobs:
  full-sync:
    runs-on: ubuntu-latest
    # GitHub Actions free tier allows up to 6 hours per job — this backfill
    # (40 pages x 5 countries x 10 languages, plus wikidata) should finish
    # well within 1-2 hours, but the ceiling is set generously just in case.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run deep backfill
        run: npm run sync:full
        env:
          TMDB_API_ACCESS_TOKEN: ${{ secrets.TMDB_API_ACCESS_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
